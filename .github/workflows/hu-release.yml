name: Hungarian build release

# The fork's own release: Windows x64 and macOS universal, unsigned, from the branch it is run on.
# The packaging scripts are upstream's; without signing secrets they build unsigned (Windows) and
# ad-hoc signed (macOS). The release is a draft until it has been checked, and never a
# prerelease, so that `releases/latest` (the updater's and AI+ Iroda's lookup) finds it.
# Started from the Actions tab or `gh workflow run hu-release.yml -f version=<v>`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.12.0-hu.1"
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  VERSION: ${{ inputs.version }}
  WORDCRAFT_VERSION: ${{ inputs.version }}
  WORDCRAFT_BUILD_SHA: ${{ github.sha }}
  BUILD_SHA: ${{ github.sha }}
  CRAFT_FONTS_REF: b076417b5880bd4154bd22f00695b1d28c6bea83

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@2b3fb9dc05036f73c77d18f753a3aa9da55fa386
        with:
          ref: ${{ env.CRAFT_FONTS_REF }}
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@2b3fb9dc05036f73c77d18f753a3aa9da55fa386
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: hu-release-windows-x64
      - name: Set version
        shell: bash
        run: |
          echo "BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          echo "WORDCRAFT_BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          cargo xtask version set "$VERSION"
      - uses: storytold/craft-common-actions/actions/install-wix@2b3fb9dc05036f73c77d18f753a3aa9da55fa386
        with:
          wix-version: "5.0.2"
      - name: Build and package
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@2b3fb9dc05036f73c77d18f753a3aa9da55fa386
        with:
          ref: ${{ env.CRAFT_FONTS_REF }}
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@2b3fb9dc05036f73c77d18f753a3aa9da55fa386
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: hu-release-macos-universal
      - name: Set version
        run: |
          echo "BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          echo "WORDCRAFT_BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          cargo xtask version set "$VERSION"
      - name: Build and package
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "WordCraft $VERSION (Hungarian proofing)" \
            --notes "WordCraft ${VERSION%%-*} with the Hungarian spelling, grammar and hyphenation of storytold/wordcraft#2385 and the fixes offered on #2070 and #2385, until upstream merges them. Unsigned: Windows SmartScreen asks once (More info → Run anyway); on macOS open it with right-click → Open." \
            -- *
